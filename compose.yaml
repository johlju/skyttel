services:
  skyttel:
    build: .
    image: skyttel:local
    init: true
    restart: unless-stopped
    env_file: .env.local
    environment:
      SKYTTEL_DATABASE_PATH: /data/skyttel.sqlite
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - skyttel-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 20s

volumes:
  skyttel-data:
