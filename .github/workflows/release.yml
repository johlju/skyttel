name: Container release

on:
  push:
    branches: [main]
    # This pattern excludes preview tags created by the main release chain.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# All channels share a publisher lock. Never cancel a partially published chain.
concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'viscalyx/skyttel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Restore the original version decision on retries
        id: restore
        run: node scripts/release/restore.mjs release-plan release
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.restore.outputs.found != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Calculate the version from full history at the exact source commit
        if: steps.restore.outputs.found != 'true'
        run: |
          dotnet tool restore
          if [ "$GITHUB_REF" = refs/heads/main ]; then git switch -C main "$GITHUB_SHA"; fi
          dotnet gitversion /nofetch /nonormalize /output json > "$RUNNER_TEMP/gitversion.json"
      - name: Validate the release plan and capture revision-bound guidance
        id: plan
        run: node scripts/release/plan.mjs "$RUNNER_TEMP/gitversion.json" release
      - name: Preserve release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.restore.outputs.found != 'true'
        with:
          name: release-plan
          path: release
          if-no-files-found: error
          retention-days: 90

  checks:
    needs: plan
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  candidate:
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Restore the frozen plan
        run: node scripts/release/restore.mjs release-plan release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Reuse a previously verified candidate
        id: restore
        run: node scripts/release/restore.mjs release-candidate release
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.restore.outputs.found != 'true'
      - name: Build one OCI archive
        if: steps.restore.outputs.found != 'true'
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$(jq -r .fullVersion release/plan.json)" \
            --output type=oci,dest=release/image.oci.tar .
      - name: Verify every OCI blob and bind source, version and manifest digest
        id: inspect
        run: |
          mkdir "$RUNNER_TEMP/oci"
          tar -xf release/image.oci.tar -C "$RUNNER_TEMP/oci"
          node scripts/release/candidate.mjs inspect release "$RUNNER_TEMP/oci"
      - name: Load the candidate for production behavior tests
        if: steps.restore.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo copy oci-archive:release/image.oci.tar docker-daemon:skyttel-release:verified
          docker save skyttel-release:verified -o "$RUNNER_TEMP/loaded-image.tar"
          config=$(tar -xOf "$RUNNER_TEMP/loaded-image.tar" manifest.json | jq -er 'if length == 1 then .[0].Config else error("Expected one image") end')
          loaded_id=$(tar -xOf "$RUNNER_TEMP/loaded-image.tar" "$config" | sha256sum | awk '{print "sha256:" $1}')
          test "$loaded_id" = "$(cat release/image-id.txt)"
          skopeo --version > release/tool-versions.txt
          docker buildx version >> release/tool-versions.txt
          node scripts/install-repository-npm.mjs
          npm ci
          SKYTTEL_CHECK_IMAGE=skyttel-release:verified npm run test:container
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        if: steps.restore.outputs.found != 'true'
        with:
          image: oci-archive:release/image.oci.tar
          syft-version: v1.52.0
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        if: steps.restore.outputs.found != 'true'
        with:
          image: oci-archive:release/image.oci.tar
          grype-version: v0.119.0
          output-format: json
          output-file: release/grype.json
          config: .github/grype.yaml
          only-fixed: false
          fail-build: false
      - name: Evaluate image findings and test the running candidate
        if: steps.restore.outputs.found != 'true'
        run: |
          node scripts/security/check-results.mjs grype release .github/security-exceptions.json
          bash scripts/security/scan-running-image.sh skyttel-release:verified "$RUNNER_TEMP/zap"
          cp "$RUNNER_TEMP/zap/zap.json" "$RUNNER_TEMP/zap/zap.html" release/
      # Upload only after all candidate checks pass. Existing artifacts are never overwritten.
      - name: Preserve verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.restore.outputs.found != 'true'
        with:
          name: release-candidate
          path: release
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [plan, checks, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Reject any missing or failed prerequisite
        run: node scripts/security/check-results.mjs jobs plan checks candidate
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
      - name: Restore the verified candidate
        run: node scripts/release/restore.mjs release-candidate release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Restore signed evidence and release text on retries
        id: evidence
        run: node scripts/release/restore.mjs release-evidence release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate the original plan and archive again before publication
        run: |
          node scripts/release/plan.mjs release/gitversion.json release
          mkdir "$RUNNER_TEMP/oci"
          tar -xf release/image.oci.tar -C "$RUNNER_TEMP/oci"
          node scripts/release/candidate.mjs inspect release "$RUNNER_TEMP/oci"
      - name: Require retained scan evidence to still meet security policy
        run: |
          node scripts/security/check-results.mjs grype release .github/security-exceptions.json
          node scripts/security/check-results.mjs zap release/zap.json
      - name: Attest the image build
        id: provenance
        if: steps.evidence.outputs.found != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
      - name: Attest the SPDX inventory for the same digest
        id: sbom
        if: steps.evidence.outputs.found != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
          sbom-path: release/sbom.spdx.json
      - name: Retain original signed bundles
        if: steps.evidence.outputs.found != 'true'
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" release/sbom.sigstore.json
      - name: Verify signatures, source revision and signed inventory
        run: node scripts/release/candidate.mjs verify release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare channel-specific notes and reject conflicting release evidence
        run: |
          node scripts/release/github-release.mjs prepare release
          node scripts/release/github-release.mjs preflight release
          node scripts/release/candidate.mjs preflight release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.evidence.outputs.found != 'true'
        with:
          name: release-evidence
          path: |
            release
            !release/image.oci.tar
          if-no-files-found: error
          retention-days: 90
      - name: Publish the exact archive and complete only missing release steps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
          printf '%s' "$GH_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          node scripts/release/candidate.mjs publish release
          node scripts/release/github-release.mjs publish release
