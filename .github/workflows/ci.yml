name: Application checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      # Cache initialization invokes npm, so install the required version first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Workflow gate tests
        run: |
          mkdir -p logs/tests
          npm run test:gates 2>&1 | tee logs/tests/gates.log
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:docs
      - name: Manual mapping
        run: |
          npm run test:manual-mapping 2>&1 | tee logs/tests/manual-mapping.log
      - run: npm run build
      - name: Container checks
        run: |
          npm run test:container 2>&1 | tee logs/tests/container.log
      - name: Retain failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-test-diagnostics-${{ github.run_attempt }}
          path: logs/tests/
          if-no-files-found: ignore
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Unit coverage with CI fonts
        run: |
          mkdir -p logs/tests
          npm run test:unit:ci -- --coverage 2>&1 | tee logs/tests/unit.log
      - name: Retain failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-diagnostics-${{ github.run_attempt }}
          path: |
            tests/browser/__screenshots__/
            .vitest/attachments/
            logs/tests/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  integration-1:
    uses: ./.github/workflows/integration-group.yml
    with:
      group: 1

  integration-2:
    uses: ./.github/workflows/integration-group.yml
    with:
      group: 2

  integration-3:
    uses: ./.github/workflows/integration-group.yml
    with:
      group: 3

  integration-4:
    uses: ./.github/workflows/integration-group.yml
    with:
      group: 4

  application:
    if: always()
    needs: [checks, unit, integration-1, integration-2, integration-3, integration-4]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require successful test jobs
        if: always()
        run: node scripts/security/check-results.mjs jobs checks unit integration-1 integration-2 integration-3 integration-4
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}

  devcontainer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - run: npm ci
      - run: npm run test:devcontainer

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  security-gate:
    if: always()
    needs: [application, devcontainer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/security/check-results.mjs jobs application security
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
      - name: Require devcontainer checks for pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/security/check-results.mjs jobs devcontainer
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
