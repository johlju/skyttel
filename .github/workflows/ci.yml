name: Application checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      # Cache initialization invokes npm, so install the required version first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:gates
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:unit:coverage
      - run: npm run test:integration
      - run: npm run test:container

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - run: npm ci
      - run: npm run test:devcontainer

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  security-gate:
    if: always()
    needs: [application, devcontainer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/security/check-results.mjs jobs application devcontainer security
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
