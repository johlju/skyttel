name: Integration group

on:
  workflow_call:
    inputs:
      group:
        required: true
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Integration tests with CI fonts
        env:
          INTEGRATION_GROUP: ${{ inputs.group }}
        run: |
          mkdir -p logs/tests
          npm run test:integration:group -- --group "$INTEGRATION_GROUP" 2>&1 | tee logs/tests/integration.log
      - name: Retain group diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-diagnostics-group-${{ inputs.group }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report*/
            logs/tests/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
