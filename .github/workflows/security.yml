name: Security checks

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Match the existing main-branch baseline for both CI and release callers.
      CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/release.yml:codeql
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript,actions
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: reports/codeql
          upload: always
      # Upload success alone does not mean the findings meet policy.
      - run: node scripts/security/check-results.mjs codeql reports/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-results
          path: reports/codeql
          if-no-files-found: error
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - run: npm audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.4
        with:
          version: v0.74.0
      - name: Scan configuration and reject parser errors
        run: |
          status=0
          trivy config --skip-dirs node_modules,.git --skip-files '**/*.dockerignore' \
            --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy.json \
            . 2> trivy-errors.log || status=$?
          cat trivy-errors.log >&2
          test "$status" -eq 0
          if grep -q 'ERROR' trivy-errors.log; then
            exit 1
          fi
          node scripts/security/check-results.mjs trivy trivy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: configuration-results
          path: trivy.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history with redacted output
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: mkdir -p reports && docker build --tag skyttel-security .
      - name: Bind evidence to the exported image configuration
        run: |
          docker save skyttel-security -o "$RUNNER_TEMP/security-image.tar"
          config=$(tar -xOf "$RUNNER_TEMP/security-image.tar" manifest.json | jq -er 'if length == 1 then .[0].Config else error("Expected one image") end')
          tar -xOf "$RUNNER_TEMP/security-image.tar" "$config" | sha256sum | awk '{print "sha256:" $1}' > reports/image-id.txt
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: docker-archive:${{ runner.temp }}/security-image.tar
          syft-version: v1.52.0
          format: spdx-json
          output-file: reports/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: docker-archive:${{ runner.temp }}/security-image.tar
          grype-version: v0.119.0
          output-format: json
          output-file: reports/grype.json
          config: .github/grype.yaml
          only-fixed: false
          # Findings are evaluated below; scanner execution errors still fail.
          fail-build: false
      - run: node scripts/security/check-results.mjs grype reports .github/security-exceptions.json
      - name: ZAP baseline against disposable production installation
        run: bash scripts/security/scan-running-image.sh skyttel-security reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-security-results
          path: reports
          if-no-files-found: error
          retention-days: 14

  scanner-gate:
    if: always()
    needs: [codeql, dependencies, configuration, secrets, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/security/check-results.mjs jobs codeql dependencies configuration secrets container
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
