name: Deployed image security

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      verify_notification:
        description: Send a controlled delivery check to the configured operator
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  monitor:
    if: github.repository == 'viscalyx/skyttel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # Prevent competing issue updates without replacing queued release deployments.
    concurrency:
      group: deployed-image-security
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      packages: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned inventory and vulnerability tools
        id: tools
        run: |
          bash scripts/security/install-image-scanners.sh "$RUNNER_TEMP/image-monitor-tools"
          echo "$RUNNER_TEMP/image-monitor-tools" >> "$GITHUB_PATH"
      - name: Observe, scan and reconcile operator status
        if: always()
        run: node scripts/security/monitor-images.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ github.token }}
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          SECURITY_MONITOR_RECIPIENT: ${{ vars.SECURITY_MONITOR_RECIPIENT }}
          VERIFY_NOTIFICATION: ${{ inputs.verify_notification }}
          SCAN_PREREQUISITES_OK: ${{ steps.tools.outcome == 'success' }}
      - name: Retain sanitized image status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-image-security
          path: monitoring/status.json
          if-no-files-found: error
          retention-days: 90
