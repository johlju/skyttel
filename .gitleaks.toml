[extend]
useDefault = true

# This literal belongs exclusively to disposable test installations. Match
# both its exact value and these fixture paths; do not exempt whole files.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Known synthetic SQLite test authentication secret"
condition = "AND"
regexTarget = "secret"
regexes = ['''^synthetic-test-secret-with-at-least-32-characters$''']
paths = ['''^(tests/integration/database-setup\.spec\.ts|tests/support/installation\.ts|scripts/check-container\.mjs)$''']

[[rules.allowlists]]
description = "Known synthetic authentication secret for the disposable ZAP installation"
condition = "AND"
regexTarget = "secret"
regexes = ['''^synthetic-ci-secret-at-least-32-characters$''']
paths = ['''^(\.github/workflows/security\.yml|scripts/security/scan-running-image\.sh)$''']

# Historical disposable Better Auth probe: in-memory SQLite, loopback origin
# and a synthetic identity provider. Match this literal and this path only.
[[rules.allowlists]]
description = "Known synthetic authentication secret in the browser-binding research probe"
condition = "AND"
regexTarget = "secret"
regexes = ['''^synthetic-secret-for-441-at-least-thirty-two-characters$''']
paths = ['''^research/browser-binding-probe\.mjs$''']

# Verified SHA-256 of docs/manual-tests/access.md at 020273b1. The history
# scan includes the regression baseline branch, which records this checksum.
[[rules.allowlists]]
description = "Verified manual access guide checksum in the regression baseline"
condition = "AND"
regexTarget = "secret"
regexes = ['''^517c3e38ff302eb51a2bda795f72bf525eece3578193b71a352d9bc934c1cc32$''']
paths = ['''^research/regression-baseline/environment\.json$''']
